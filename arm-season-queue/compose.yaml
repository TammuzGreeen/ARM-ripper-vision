name: arm-season-queue
services:
  queue:
    build: .
    image: arm-season-queue:0.1.1
    user: "${SERVICE_UID:-568}:${SERVICE_GID:-568}"
    group_add:
      - "${CAMERA_GID:?Set numeric group owner of the video capture device}"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=512m,mode=1777
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${QUEUE_PORT:-8080}:8080"
    devices:
      - "${CAMERA_HOST_DEVICE:?Set stable camera capture device}:/dev/video0:rw"
    environment:
      ARM_URL: ${ARM_URL:-}
      ARM_BEARER_TOKEN: ${ARM_BEARER_TOKEN:-}
      ARM_EXPECTED_VERSION: ${ARM_EXPECTED_VERSION:-19.1.0}
      ARM_VERIFIED_SOURCE_SHA: ${ARM_VERIFIED_SOURCE_SHA:-}
      ARM_MEDIA_PREFIX: ${ARM_MEDIA_PREFIX:-/home/arm/media}
      ARM_DRIVE: ${ARM_DRIVE:-/dev/sr0}
      QUEUE_USER: ${QUEUE_USER:-operator}
      QUEUE_PASSWORD: ${QUEUE_PASSWORD:?Set a private queue password}
      CAMERA_DEVICE: /dev/video0
      CAMERA_MODE: ${CAMERA_MODE:-}
      CAMERA_WIDTH: ${CAMERA_WIDTH:-3840}
      CAMERA_HEIGHT: ${CAMERA_HEIGHT:-2160}
      CAMERA_FPS: ${CAMERA_FPS:-15}
      CAMERA_ROTATION: ${CAMERA_ROTATION:-0}
      CAMERA_ROI: ${CAMERA_ROI:-0.15,0.1,0.85,0.9}
      CAMERA_SHARPNESS: ${CAMERA_SHARPNESS:-100}
      RECOGNITION_BACKEND: ${RECOGNITION_BACKEND:-tesseract}
      VISION_BASE_URL: ${VISION_BASE_URL:-}
      VISION_MODEL: ${VISION_MODEL:-}
      VISION_API_KEY: ${VISION_API_KEY:-}
      VISION_TIMEOUT_SECONDS: ${VISION_TIMEOUT_SECONDS:-300}
      VISION_SHORT_NUM_PREDICT: ${VISION_SHORT_NUM_PREDICT:-768}
      VISION_SHORT_TIMEOUT_SECONDS: ${VISION_SHORT_TIMEOUT_SECONDS:-240}
      OCR_LANG: ${OCR_LANG:-deu+eng}
      CAPTURE_TTL_SECONDS: ${CAPTURE_TTL_SECONDS:-180}
      EVIDENCE_RETENTION_DAYS: ${EVIDENCE_RETENTION_DAYS:-30}
      BATCH_SWITCH_POLICY: ${BATCH_SWITCH_POLICY:-review}
      FILEFLOWS_ENABLED: ${FILEFLOWS_ENABLED:-true}
    volumes:
      - ${STATE_HOST:?Choose a new persistent state directory}:/state
      - ${HANDOVER_HOST:?Choose a handover directory}:/handover
      - ${ARM_MEDIA_HOST:?Set existing ARM media mount}:/media:ro

  # Optional CLI test runner. FileFlows stays a separate application.
  publisher:
    profiles: [tools]
    image: arm-season-queue:0.1.1
    user: "${SERVICE_UID:-568}:${SERVICE_GID:-568}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    volumes:
      - ${HANDOVER_HOST:?Set handover directory}:/handover
      - ${ARM_MEDIA_HOST:?Set ARM media directory}:/media:ro
      - ${LIBRARY_HOST:-/mnt/POOL/media/library}:/library
    entrypoint: [python, -m, app.publish]
    command: [--help]

