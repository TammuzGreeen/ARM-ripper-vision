[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arm-ripper-vision"
version = "0.1.0"
description = "Deterministic masterlist-driven orchestration for Automatic Ripping Machine Neu"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PyYAML>=6,<7",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10","pytest-asyncio>=0.24,<2","ruff>=0.9,<1"]
[project.scripts]
arm-ripper-vision = "arm_ripper_vision.main:run"
[tool.setuptools.packages.find]
include = ["arm_ripper_vision*"]
[tool.setuptools.package-data]
arm_ripper_vision = ["templates/*.html", "static/*.css"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E","F","I","UP","B"]
