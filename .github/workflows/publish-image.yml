name: Publish container

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image to be tested and published
        uses: docker/build-push-action@v6
        with:
          context: ./arm-season-queue
          platforms: linux/amd64
          load: true
          tags: arm-season-queue:test
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run companion tests inside the built image
        run: |
          docker run --rm --read-only --tmpfs /tmp:mode=1777 \
            -v "$PWD/arm-season-queue/tests:/app/tests:ro" \
            arm-season-queue:test python -m unittest discover -s tests -v
      - name: Smoke test non-root startup and HTTP health
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker logs queue-smoke; docker rm -f queue-smoke' EXIT
          docker run -d --name queue-smoke --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp:mode=1777 --tmpfs /state:uid=568,gid=568,mode=0700 \
            --tmpfs /handover:uid=568,gid=568,mode=0700 \
            -e QUEUE_PASSWORD="$(openssl rand -hex 24)" arm-season-queue:test
          for attempt in $(seq 1 30); do
            if docker exec queue-smoke python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        shell: bash
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY_OWNER,,}/arm-season-queue"
          for tag in "sha-$REVISION" main latest; do
            docker tag arm-season-queue:test "$image:$tag"
            docker push "$image:$tag"
          done
          echo "Published $image:sha-$REVISION (linux/amd64)" >> "$GITHUB_STEP_SUMMARY"
